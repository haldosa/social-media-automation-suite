<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARMER — Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #080c0f;
    --bg2:       #0d1318;
    --bg3:       #111920;
    --border:    #1e2d38;
    --border2:   #243542;
    --text:      #8faabb;
    --text2:     #c5d8e8;
    --text3:     #e8f4ff;
    --dim:       #3a5060;
    --green:     #00e57a;
    --green-dim: #004d2a;
    --red:       #ff3d5a;
    --red-dim:   #3d0010;
    --amber:     #ffb020;
    --amber-dim: #3d2800;
    --blue:      #00aaff;
    --blue-dim:  #002a3d;
    --cyan:      #00d4d4;
    --mono:      'Share Tech Mono', monospace;
    --sans:      'Barlow', sans-serif;
    --cond:      'Barlow Condensed', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ── Layout ── */
  .shell {
    display: grid;
    grid-template-rows: 48px 1fr;
    grid-template-columns: 220px 1fr 280px;
    grid-template-areas:
      "header header header"
      "sidebar main logs";
    height: 100vh;
  }

  /* ── Header ── */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.3;
  }

  .logo {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 4px;
    color: var(--text3);
    text-transform: uppercase;
  }

  .logo span { color: var(--cyan); }

  .header-sep {
    width: 1px;
    height: 20px;
    background: var(--border2);
  }

  .sys-time {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    margin-left: auto;
  }

  .sys-time span { color: var(--amber); }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse-dot 2s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Sidebar ── */
  .sidebar {
    grid-area: sidebar;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    overflow-y: auto;
  }

  .sidebar-section {
    padding: 0 14px;
    margin-bottom: 24px;
  }

  .sidebar-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    padding: 0 2px;
    margin-bottom: 8px;
  }

  /* ── Process cards in sidebar ── */
  .proc-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 12px;
    margin-bottom: 6px;
    transition: border-color 0.2s;
  }

  .proc-card:hover { border-color: var(--border2); }

  .proc-card.running {
    border-color: var(--green-dim);
    background: #0a1510;
  }

  .proc-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .proc-indicator {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }

  .proc-card.running .proc-indicator {
    background: var(--green);
    box-shadow: 0 0 5px var(--green);
    animation: pulse-dot 1.5s infinite;
  }

  .proc-name {
    font-family: var(--cond);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text2);
    flex: 1;
  }

  .proc-pid {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--dim);
  }

  .proc-uptime {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--amber);
    margin-bottom: 8px;
    padding-left: 11px;
  }

  .btn-row {
    display: flex;
    gap: 4px;
  }

  /* ── Buttons ── */
  .btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1px solid;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
    flex: 1;
    text-align: center;
  }

  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.3; cursor: default; }

  .btn-start {
    color: var(--green);
    border-color: var(--green-dim);
    background: transparent;
  }
  .btn-start:hover:not(:disabled) {
    background: var(--green-dim);
    box-shadow: 0 0 8px rgba(0,229,122,0.15);
  }

  .btn-stop {
    color: var(--red);
    border-color: var(--red-dim);
    background: transparent;
  }
  .btn-stop:hover:not(:disabled) {
    background: var(--red-dim);
    box-shadow: 0 0 8px rgba(255,61,90,0.15);
  }

  .btn-action {
    color: var(--blue);
    border-color: var(--blue-dim);
    background: transparent;
  }
  .btn-action:hover:not(:disabled) {
    background: var(--blue-dim);
  }

  .btn-full {
    width: 100%;
    padding: 7px;
    font-size: 11px;
  }

  /* ── Main content ── */
  main {
    grid-area: main;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── Section headers ── */
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .section-title {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text2);
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Panels ── */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px 16px;
  }

  /* ── Form elements ── */
  .field {
    margin-bottom: 10px;
  }

  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .field input,
  .field select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text2);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 8px;
    outline: none;
    transition: border-color 0.15s;
  }

  .field input:focus,
  .field select:focus {
    border-color: var(--cyan);
  }

  .field select option { background: var(--bg3); }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .field-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  /* ── Checkbox toggle ── */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .toggle-row label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }

  input[type="checkbox"] {
    appearance: none;
    width: 14px; height: 14px;
    border: 1px solid var(--border2);
    border-radius: 2px;
    background: var(--bg3);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }

  input[type="checkbox"]:checked {
    background: var(--cyan);
    border-color: var(--cyan);
  }

  input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    top: -1px; left: 1px;
    font-size: 11px;
    color: var(--bg);
    font-weight: bold;
  }

  /* ── Test action grid ── */
  .action-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 10px;
  }

  .action-btn {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 8px 6px;
    border: 1px solid var(--border2);
    border-radius: 2px;
    background: var(--bg3);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .action-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
    background: var(--blue-dim);
  }

  .action-btn.selected {
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(0, 212, 212, 0.08);
  }

  /* ── Toast notifications ── */
  #toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 10000;
  }

  .toast {
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px 14px;
    border-radius: 2px;
    border-left: 3px solid;
    background: var(--bg2);
    color: var(--text2);
    animation: toast-in 0.2s ease-out;
    max-width: 320px;
  }

  .toast.ok    { border-color: var(--green); }
  .toast.error { border-color: var(--red); }
  .toast.info  { border-color: var(--amber); }

  @keyframes toast-in {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── Log panel ── */
  .logs-panel {
    grid-area: logs;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .logs-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .logs-title {
    font-family: var(--cond);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text2);
    flex: 1;
  }

  .logs-clear {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .logs-clear:hover { color: var(--text); }

  #log-box {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.6;
  }

  #log-box::-webkit-scrollbar { width: 4px; }
  #log-box::-webkit-scrollbar-track { background: transparent; }
  #log-box::-webkit-scrollbar-thumb { background: var(--border2); }

  .log-line { display: block; word-break: break-all; }
  .log-info    { color: #4a6575; }
  .log-info-hi { color: var(--text); }
  .log-warn    { color: var(--amber); }
  .log-error   { color: var(--red); }
  .log-daemon  { color: #5a9aaa; }
  .log-action  { color: #7acf9a; }
  .log-cookie  { color: #9a7acf; }

  /* Highlight keywords */
  .kw-pass    { color: var(--green); font-weight: bold; }
  .kw-fail    { color: var(--red); }
  .kw-start   { color: var(--cyan); }

  /* ── Heartbeat strip ── */
  .heartbeat-strip {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    flex-shrink: 0;
  }

  .hb-item {
    font-family: var(--mono);
    font-size: 9px;
  }

  .hb-label { color: var(--dim); }
  .hb-value { color: var(--text2); }

  /* ── Schedule table ── */
  .sched-table {
    width: 100%;
    border-collapse: collapse;
  }

  .sched-table th {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dim);
    padding: 4px 8px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .sched-table td {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
  }

  .sched-table tr:last-child td { border-bottom: none; }
  .sched-table td.done  { color: var(--green); }
  .sched-table td.next  { color: var(--amber); }
  .sched-table td.pid-col { color: var(--dim); font-size: 9px; }

  /* ── Scrollbars ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

</style>
</head>
<body>

<div class="shell">

  <!-- ── Header ── -->
  <header>
    <div class="status-dot" id="conn-dot"></div>
    <div class="logo">NST<span>WARMER</span></div>
    <div class="header-sep"></div>
    <div class="sys-time">SYS <span id="clock">--:--:--</span></div>
    <div class="header-sep"></div>
    <div class="sys-time">LAST UPDATE <span id="last-update">—</span></div>
  </header>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-label">Processes</div>

      <!-- Daemon -->
      <div class="proc-card" id="card-daemon">
        <div class="proc-header">
          <div class="proc-indicator" id="dot-daemon"></div>
          <div class="proc-name">Daemon</div>
          <div class="proc-pid" id="pid-daemon"></div>
        </div>
        <div class="proc-uptime" id="uptime-daemon" style="display:none"></div>
        <div class="btn-row">
          <button class="btn btn-start" id="btn-daemon-start" onclick="daemonStart()">START</button>
          <button class="btn btn-stop"  id="btn-daemon-stop"  onclick="daemonStop()" disabled>STOP</button>
        </div>
      </div>

<!-- Cookie single session -->
<div class="proc-card" id="card-cookie-single">
  <div class="proc-header">
    <div class="proc-indicator" id="dot-cookie-single"></div>
    <div class="proc-name">Cookie Session</div>
    <div class="proc-pid" id="pid-cookie-single"></div>
  </div>
  <div class="proc-uptime" id="uptime-cookie-single" style="display:none"></div>
  <div class="btn-row">
    <button class="btn btn-start" id="btn-cookie-single-start" onclick="cookieSingleStart()">START</button>
    <button class="btn btn-stop"  id="btn-cookie-single-stop"  onclick="cookieSingleStop()" disabled>STOP</button>
  </div>
</div>

<!-- One-shot session -->
      <div class="proc-card" id="card-session">
        <div class="proc-header">
          <div class="proc-indicator" id="dot-session"></div>
          <div class="proc-name">Session</div>
          <div class="proc-pid" id="pid-session"></div>
        </div>
        <div class="proc-uptime" id="uptime-session" style="display:none"></div>
        <div class="btn-row">
          <button class="btn btn-start" id="btn-session-start" onclick="sessionStart()">START</button>
          <button class="btn btn-stop"  id="btn-session-stop"  onclick="sessionStop()" disabled>STOP</button>
        </div>
      </div>

      <!-- Test -->
      <div class="proc-card" id="card-test">
        <div class="proc-header">
          <div class="proc-indicator" id="dot-test"></div>
          <div class="proc-name">Test Action</div>
          <div class="proc-pid" id="pid-test"></div>
        </div>
        <div class="proc-uptime" id="uptime-test" style="display:none"></div>
        <div class="btn-row">
          <button class="btn btn-start" id="btn-test-start" onclick="testStart()">RUN</button>
          <button class="btn btn-stop"  id="btn-test-stop"  onclick="testStop()" disabled>STOP</button>
        </div>
      </div>
    </div>

  </aside>

  <!-- ── Main ── -->
  <main>

    <!-- Daemon config -->
    <div>
      <div class="section-head">
        <div class="section-title">Daemon</div>
        <div class="section-line"></div>
      </div>
      <div class="panel">
        <button class="btn btn-start btn-full" onclick="daemonStart()">START DAEMON</button>
      </div>
    </div>

    <!-- One-shot session config -->
    <div>
      <div class="section-head">
        <div class="section-title">Single Session</div>
        <div class="section-line"></div>
      </div>
      <div class="panel">
        <div class="field">
          <label>Profile ID</label>
          <input type="text" id="session-profile" placeholder="UUID">
        </div>
        <div class="toggle-row">
          <input type="checkbox" id="session-no-preflight">
          <label for="session-no-preflight">--no-preflight</label>
        </div>
        <button class="btn btn-start btn-full" onclick="sessionStart()">RUN SESSION</button>
      </div>
    </div>

    <!-- One-shot cookie session config -->
    <div>
      <div class="section-head">
        <div class="section-title">Cookie Session</div>
        <div class="section-line"></div>
      </div>
      <div class="panel">
        <div class="field">
          <label>Profile ID</label>
          <input type="text" id="cookie-profile" placeholder="UUID">
        </div>
        <div class="field">
            <label>Runs per session</label>
            <input type="number" id="cookie-runs" value="1" min="1" max="5">
          </div>
        <button class="btn btn-start btn-full" onclick="cookieSingleStart()">RUN COOKIE SESSION</button>
      </div>
    </div>

    <!-- Test actions -->
    <div>
      <div class="section-head">
        <div class="section-title">Test Actions</div>
        <div class="section-line"></div>
      </div>
      <div class="panel">
        <div class="field">
          <label>Profile ID</label>
          <input type="text" id="test-profile" placeholder="UUID">
        </div>
        <div class="action-grid">
          <div class="action-btn selected" data-action="like"         onclick="selectAction(this)">like</div>
          <div class="action-btn"          data-action="comment"      onclick="selectAction(this)">comment</div>
          <div class="action-btn"          data-action="follow"       onclick="selectAction(this)">follow</div>
          <div class="action-btn"          data-action="view_profile" onclick="selectAction(this)">profile</div>
          <div class="action-btn"          data-action="search"       onclick="selectAction(this)">search</div>
          <div class="action-btn"          data-action="post"         onclick="selectAction(this)">post</div>
          <div class="action-btn"          data-action="passive"      onclick="selectAction(this)">passive</div>
          <div class="action-btn"          data-action="notifications" onclick="selectAction(this)">notifs</div>
        </div>
        <div style="margin-top:10px">
          <button class="btn btn-action btn-full" onclick="testStart()">RUN TEST</button>
        </div>
      </div>
    </div>

    <!-- Schedule -->
    <div>
      <div class="section-head">
        <div class="section-title">Schedule</div>
        <div class="section-line"></div>
      </div>
      <div class="panel" style="padding:0;overflow:hidden">
        <table class="sched-table">
          <thead>
            <tr>
              <th>Profile</th>
              <th>Next Run</th>
              <th>Done</th>
              <th>Target</th>
            </tr>
          </thead>
          <tbody id="sched-body">
            <tr><td colspan="4" style="color:var(--dim);text-align:center;padding:12px">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ── Logs ── -->
  <div class="logs-panel">
    <div class="logs-header">
  <div class="logs-title">Live Log</div>
  <select id="log-source" onchange="switchLog()" style="
    background: var(--bg3); border: 1px solid var(--border2);
    color: var(--text); font-family: var(--mono); font-size: 10px;
    padding: 2px 6px; border-radius: 2px;">
    <option value="warmer">warmer</option>
    <option value="cookie">cookie</option>
    <option value="flask">flask</option>
  </select>
  <button class="logs-clear" onclick="clearLogs()">CLEAR</button>
</div>
    <div id="log-box"></div>
    <div class="heartbeat-strip" id="hb-strip">
      <div class="hb-item"><span class="hb-label">NEXT // </span><span class="hb-value" id="hb-next">—</span></div>
      <div class="hb-item"><span class="hb-label">UPTIME // </span><span class="hb-value" id="hb-uptime">—</span></div>
      <div class="hb-item"><span class="hb-label">PROFILE // </span><span class="hb-value" id="hb-profile">—</span></div>
      <div class="hb-item"><span class="hb-label">BEAT // </span><span class="hb-value" id="hb-beat">—</span></div>
    </div>
  </div>

</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let selectedAction = 'like';
let autoScroll = true;

// ── Clock ─────────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toTimeString().slice(0, 8);
}
setInterval(updateClock, 1000);
updateClock();

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── API helper ────────────────────────────────────────────────────────────────
async function api(url, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return res.json();
}

// ── Action selector ───────────────────────────────────────────────────────────
function selectAction(el) {
  document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedAction = el.dataset.action;
}

// ── Process controls ──────────────────────────────────────────────────────────
async function daemonStart() {
  const r = await api('/api/daemon/start', 'POST');
  toast(r.msg, r.ok ? 'ok' : 'error');
}

async function daemonStop() {
  const r = await api('/api/daemon/stop', 'POST');
  toast(r.msg, r.ok ? 'ok' : 'error');
}

async function cookieSingleStart() { 
  const profile     = document.getElementById('cookie-profile').value.trim();
  const runs        = document.getElementById('cookie-runs').value.trim();
  const body = {};
  if (profile) body.profile_id = profile;
  if (runs) body.runs = runs;
  const r = await api('/api/cookie/single/start', 'POST', body);
  toast(r.msg, r.ok ? 'ok' : 'error');
}

async function cookieSingleStop() {
  const r = await api('/api/cookie/single/stop', 'POST');
  toast(r.msg, r.ok ? 'ok' : 'error');
}


async function sessionStart() {
  const profile     = document.getElementById('session-profile').value.trim();
  const noPreflight = document.getElementById('session-no-preflight').checked;
  const body        = { no_preflight: noPreflight };
  if (profile) body.profile_id = profile;

  const r = await api('/api/session/start', 'POST', body);

async function sessionStop() {
  const r = await api('/api/session/stop', 'POST');
  toast(r.msg, r.ok ? 'ok' : 'error');
}

async function testStart() {
  const profile = document.getElementById('test-profile').value.trim();
  const body    = { action: selectedAction };
  if (profile) body.profile_id = profile;

  const r = await api('/api/test/start', 'POST', body);
  toast(r.msg, r.ok ? 'ok' : 'error');
}

async function testStop() {
  const r = await api('/api/test/stop', 'POST');
  toast(r.msg, r.ok ? 'ok' : 'error');
}

// ── Status polling ────────────────────────────────────────────────────────────
function applyProcStatus(key, data) {
  const card     = document.getElementById(`card-${key}`);
  const dot      = document.getElementById(`dot-${key}`);
  const pidEl    = document.getElementById(`pid-${key}`);
  const uptEl    = document.getElementById(`uptime-${key}`);
  const btnStart = document.getElementById(`btn-${key}-start`);
  const btnStop  = document.getElementById(`btn-${key}-stop`);

  // Abort silently if any required element is missing
  if (!card || !dot || !pidEl) return;

  if (data.running) {
    card.classList.add('running');
    dot.style.background = 'var(--green)';
    dot.style.boxShadow  = '0 0 5px var(--green)';
    pidEl.textContent    = data.pid ? `pid:${data.pid}` : '';
    if (uptEl) {
      uptEl.textContent   = data.uptime || '';
      uptEl.style.display = data.uptime ? 'block' : 'none';
    }
    if (btnStart) btnStart.disabled = true;
    if (btnStop)  btnStop.disabled  = false;
  } else {
    card.classList.remove('running');
    dot.style.background = 'var(--dim)';
    dot.style.boxShadow  = 'none';
    pidEl.textContent    = '';
    if (uptEl) uptEl.style.display = 'none';
    if (btnStart) btnStart.disabled = false;
    if (btnStop)  btnStop.disabled  = true;
  }
}

async function pollStatus() {
  try {
    const data = await api('/api/status');
    applyProcStatus('daemon',        data.daemon);
    applyProcStatus('cookie-single', data.cookie_session);  // was data.cookie_single
    applyProcStatus('session',       data.session);
    applyProcStatus('test',          data.test);
    document.getElementById('last-update').textContent = data.timestamp;
    document.getElementById('conn-dot').style.background = 'var(--green)';
  } catch {
    document.getElementById('conn-dot').style.background = 'var(--red)';
  }
}


setInterval(pollStatus, 2500);
pollStatus();

// ── Schedule polling ──────────────────────────────────────────────────────────
async function pollSchedule() {
  try {
    const state = await api('/api/state');
    const tbody = document.getElementById('sched-body');
    const today = new Date().toISOString().slice(0, 10);
    const rows  = [];

    for (const [pid, data] of Object.entries(state)) {
      if (typeof data !== 'object' || !data) continue;
      const nextTs   = data.next_run_ts || 0;
      const nextDate = nextTs ? new Date(nextTs * 1000).toLocaleString('en-US', {
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }) : '—';
      const daily  = (data.daily || {})[today] || {};
      const done   = daily.done   ?? '—';
      const target = daily.target ?? '—';
      rows.push({ pid, nextTs, nextDate, done, target });
    }

    rows.sort((a, b) => a.nextTs - b.nextTs);

    tbody.innerHTML = rows.length ? rows.map(r => `
      <tr>
        <td class="pid-col">${r.pid.slice(0, 12)}</td>
        <td class="next">${r.nextDate}</td>
        <td class="done">${r.done}</td>
        <td>${r.target}</td>
      </tr>
    `).join('') : '<tr><td colspan="4" style="color:var(--dim);text-align:center;padding:12px">No state data</td></tr>';
  } catch {}
}

setInterval(pollSchedule, 10000);
pollSchedule();

// ── Heartbeat polling ─────────────────────────────────────────────────────────
async function pollHeartbeat() {
  try {
    const hb = await api('/api/heartbeat');
    document.getElementById('hb-next').textContent    = hb.next_run    ? hb.next_run.slice(11, 16)    : '—';
    document.getElementById('hb-profile').textContent = hb.next_profile ? hb.next_profile.slice(0, 8) : '—';
    document.getElementById('hb-beat').textContent    = hb.last_heartbeat ? hb.last_heartbeat.slice(11, 19) : '—';
    const up = hb.uptime_seconds;
    if (up) {
      const h = Math.floor(up / 3600);
      const m = Math.floor((up % 3600) / 60);
      document.getElementById('hb-uptime').textContent = h ? `${h}h ${m}m` : `${m}m`;
    }
  } catch {}
}

setInterval(pollHeartbeat, 8000);
pollHeartbeat();

// ── Log streaming ─────────────────────────────────────────────────────────────
const logBox = document.getElementById('log-box');

function classifyLine(line) {
  if (line.includes('ERROR'))                return 'log-error';
  if (line.includes('WARNING'))              return 'log-warn';
  if (line.includes('DAEMON'))               return 'log-daemon';
  if (line.includes('ACTION') || line.includes('LIKE') || line.includes('FOLLOW')) return 'log-action';
  if (line.includes('COOKIE'))               return 'log-cookie';
  if (line.includes('INFO') && (
    line.includes('session') || line.includes('profile') || line.includes('NAV')
  ))                                         return 'log-info-hi';
  return 'log-info';
}

function appendLog(text, prepend = false) {
  const span = document.createElement('span');
  span.className = 'log-line ' + classifyLine(text);
  span.textContent = text;
  
  if (prepend) {
    logBox.insertBefore(span, logBox.firstChild);
  } else {
    logBox.appendChild(span);
  }

  while (logBox.children.length > 600)
    logBox.removeChild(logBox.lastChild);  // remove oldest (bottom) not newest
}

// Pause auto-scroll when user scrolls up
logBox.addEventListener('scroll', () => {
  const atBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 40;
  autoScroll = atBottom;
});

function clearLogs() {
  logBox.innerHTML = '';
}

let evtSource = null;

let isBackfill = true;
const backfillLines = [];

function switchLog() {
  if (evtSource) evtSource.close();
  clearLogs();
  isBackfill = true;
  backfillLines.length = 0;
  
  const name = document.getElementById('log-source').value;
  evtSource = new EventSource(`/api/logs/stream/${name}`);
  
  evtSource.onmessage = e => {
    if (e.data === '__backfill_end__') {
      // Render backfill lines in reverse (newest first)
      backfillLines.reverse().forEach(line => appendLog(line, true));
      isBackfill = false;
      return;
    }
    if (isBackfill) {
      backfillLines.push(e.data);
    } else {
      appendLog(e.data, true);  // prepend live lines
    }
  };
  
  evtSource.onerror = () => appendLog('[SSE connection lost]', true);
}

switchLog();
